<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Sticky Notes Sync</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="popup" id="popup">
  <div class="header">
    <div class="tabs" id="tabs" role="tablist" aria-label="Thư mục"></div>
    <div class="header-actions">
      <button class="icon-btn" id="addFolder" title="Thêm thư mục" aria-label="Thêm thư mục"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="icon-btn" id="delFolder" title="Xóa thư mục đang chọn" aria-label="Xóa thư mục đang chọn"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
      <span class="divider"></span>
      <button class="sync" id="sync" data-state="off" title="Chưa cấu hình Google Sheet"><span class="dot"></span><span id="syncText">Chưa đồng bộ</span></button>
      <button class="icon-btn" id="openSettings" title="Cài đặt đồng bộ" aria-label="Cài đặt đồng bộ"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </div>

  <div class="confirm-bar" id="folderConfirm" role="alertdialog" aria-labelledby="folderConfirmText">
    <span id="folderConfirmText"></span>
    <button class="btn" id="folderCancel">Hủy</button>
    <button class="btn danger" id="folderOk">Xóa thư mục</button>
  </div>

  <div class="toolbar" id="toolbar" role="toolbar" aria-label="Định dạng">
    <button class="tb" data-cmd="bold" title="Đậm (Ctrl/Cmd+B)" aria-label="Đậm" aria-pressed="false">B</button>
    <button class="tb" data-cmd="italic" title="Nghiêng (Ctrl/Cmd+I)" aria-label="Nghiêng" aria-pressed="false"><i>I</i></button>
    <button class="tb" data-cmd="underline" title="Gạch chân (Ctrl/Cmd+U)" aria-label="Gạch chân" aria-pressed="false"><u>U</u></button>
    <span class="sep"></span>
    <span id="swatches" class="swatches"></span>
    <span class="sep"></span>
    <button class="tb" data-cmd="link" title="Chèn link (Ctrl/Cmd+K)" aria-label="Chèn link"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg></button>
    <button class="tb" data-cmd="removeFormat" title="Xóa định dạng" aria-label="Xóa định dạng"><svg viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/><path d="M3 3l18 18"/></svg></button>
    <span class="hint" id="tbHint">Chọn một note để định dạng</span>
    <button class="add-note" id="addNote"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span id="addNoteText">Thêm note</span></button>
    <div class="link-pop" id="linkPop">
      <input id="linkInput" placeholder="https://…" aria-label="Địa chỉ link">
      <button class="btn primary" id="linkOk">Chèn</button>
      <button class="btn" id="linkCancel">Hủy</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="settings" id="settings" role="dialog" aria-labelledby="settingsTitle">
    <div class="top">
      <button class="icon-btn" id="closeSettings" aria-label="Quay lại"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h2 id="settingsTitle">Cài đặt đồng bộ Google Sheet</h2>
    </div>
    <form id="settingsForm">
      <div class="field">
        <label for="url">URL Apps Script (Web App)</label>
        <input id="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
        <div class="help">Lấy sau khi Deploy script trong Google Sheet của bạn. Xem hướng dẫn trong README.</div>
      </div>
      <div class="field">
        <label for="secret">Mã bí mật</label>
        <input id="secret" type="password" placeholder="Giống mã đã đặt trong script" autocomplete="off">
        <div class="help">Script sẽ từ chối mọi yêu cầu không có đúng mã này.</div>
      </div>
      <div class="row">
        <button class="btn primary" id="saveSettings" type="submit">Lưu</button>
        <button class="btn" id="testConn" type="button">Kiểm tra kết nối</button>
        <span class="result" id="testResult" aria-live="polite"></span>
      </div>
      <div class="foot">Chưa cấu hình thì note vẫn lưu trong trình duyệt bình thường, chỉ không đồng bộ.</div>
    </form>
  </div>
  <div class="sr-only" id="live" aria-live="polite"></div>
</div>
<script type="module" src="popup.js"></script>
</body>
</html>
